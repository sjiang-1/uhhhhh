<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCII camera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet" />
  <style>
    /* Fallback styles in case CSS module doesn't load */
    body { margin: 0; min-height: 100vh; background: #ffffff; font-family: "DM Sans", system-ui, sans-serif; }
    .app-root { min-height: 100vh; width: 100%; }
    .canvas-wrap { width: 100%; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .canvas-host { position: relative; width: 450px; max-width: calc(100vw - 2rem); aspect-ratio: 450 / 801; background: #fff; border: 1px solid #eee; }
    .eye-launch { position: fixed; top: 1rem; left: 1rem; z-index: 10; }
    .btn-eye { font-size: 0.8125rem; padding: 0.55rem 1rem; border: none; border-radius: 10px; background: #1a1a22; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div id="app" class="app-root">
    <div class="canvas-wrap">
      <div id="canvas-host" class="canvas-host">
        <canvas id="particles" aria-hidden="true"></canvas>
        <p style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #14141a; pointer-events: none; z-index: 1;">Enable eye tracking — camera builds your portrait</p>
      </div>
    </div>

    <div class="eye-launch">
      <button type="button" class="btn-eye" id="eye-btn">Enable eye tracking</button>
    </div>

    <div id="calibration-overlay" class="calibration-overlay" hidden>
      <p class="calibration-title">Calibrate eye tracking</p>
      <p class="calibration-hint">Look at the dot, then click anywhere to record. Do not follow the cursor with your eyes.</p>
      <div id="calibration-dot" class="calibration-dot" hidden></div>
      <p id="calibration-progress" class="calibration-progress"></p>
    </div>
    <div id="gaze-dot" aria-hidden="true"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/webgazer@2.1.0/dist/webgazer.js" crossorigin="anonymous"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
